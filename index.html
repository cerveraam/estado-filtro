<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Estado de tu filtro Montana</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
body{margin:0}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
img{max-width:100%}

/* Página de estado del cartucho Montana. Una columna estilo keynote: estado grande arriba, línea de tiempo, dos bloques de ayuda. Barra de prototipo abajo. */
:root{
  --bg:#FFFFFF; --soft:#F5F5F3; --ink:#111214; --ink-2:#5D6168; --note:#6E7279; --line:#E3E3DF;
  --blue:#2369C0; --blue-on:#FFFFFF;
  --ok:#1E8E4E; --warn:#B76E00; --warn-fill:#F2A516; --bad:#D93A40; --idle:#8B8F95;
  --on-state:#FFFFFF; --on-warn:#111214;
  --logo-filter:none;
  --font:'Manrope', system-ui, -apple-system, 'Segoe UI', sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111214; --soft:#1B1C1F; --ink:#F2F2F0; --ink-2:#A9ADB3; --note:#8E9298; --line:#2C2E32;
  --blue:#4C93EA; --blue-on:#0B0C0D; --ok:#2FBF6C; --warn:#F2A516; --warn-fill:#F2A516; --bad:#EF5A5F; --idle:#8B8F95;
  --on-state:#0B0C0D; --on-warn:#111214; --logo-filter:invert(1); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#111214; --soft:#1B1C1F; --ink:#F2F2F0; --ink-2:#A9ADB3; --note:#8E9298; --line:#2C2E32;
  --blue:#4C93EA; --blue-on:#0B0C0D; --ok:#2FBF6C; --warn:#F2A516; --warn-fill:#F2A516; --bad:#EF5A5F; --idle:#8B8F95;
  --on-state:#0B0C0D; --on-warn:#111214; --logo-filter:invert(1); color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5;
  padding-left:max(20px, env(safe-area-inset-left, 0px));padding-right:max(20px, env(safe-area-inset-right, 0px))}
.wrap{max-width:420px;margin:0 auto;padding-block:24px 20px;display:flex;flex-direction:column;min-height:100vh}
.logo{height:20px;width:auto;align-self:flex-start;filter:var(--logo-filter)}
.eyebrow{margin-top:36px;text-align:center;font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--blue);font-variant-numeric:tabular-nums}
.dot{margin:22px auto 0;width:104px;height:104px;border-radius:999px;display:grid;place-items:center;transition:background-color .3s}
.dot svg{width:52px;height:52px}
.dot[data-s="ok"]{background:var(--ok);color:var(--on-state)}
.dot[data-s="warn"]{background:var(--warn-fill);color:var(--on-warn)}
.dot[data-s="bad"]{background:var(--bad);color:var(--on-state)}
.dot[data-s="none"]{background:transparent;border:3px solid var(--line);color:var(--ink-2)}
h1{margin:22px 0 0;text-align:center;font-size:34px;font-weight:600;letter-spacing:-.045em;line-height:1.1;text-wrap:balance}
.sub{margin-top:10px;text-align:center;font-size:17px;letter-spacing:-.02em;line-height:1.35}
.sub b{font-weight:500;display:block}
.sub span{color:var(--ink-2)}
.time{margin-top:26px;background:var(--soft);border-radius:22px;padding:20px}
.time .labels,.time .dates{display:flex;justify-content:space-between;gap:12px}
.time .labels{font-size:12px;font-weight:500;color:var(--ink-2)}
.time .dates{margin-top:12px;font-size:14px;font-weight:600;font-variant-numeric:tabular-nums}
.bar{position:relative;margin-top:30px;height:10px;border-radius:10px;background:var(--line)}
.fill{position:absolute;inset:0 auto 0 0;border-radius:10px;transition:width .4s ease}
.fill[data-s="ok"]{background:var(--ok)} .fill[data-s="warn"]{background:var(--warn-fill)} .fill[data-s="bad"]{background:var(--bad)}
.now{position:absolute;top:-6px;width:2px;height:22px;margin-left:-1px;background:var(--ink);transition:left .4s ease}
.now span{position:absolute;bottom:26px;left:50%;transform:translateX(-50%);font-size:11px;font-weight:700}
.last{margin-top:14px;padding-top:12px;border-top:1px solid var(--line);font-size:13px;color:var(--ink-2)}
.last b{color:var(--ink);font-weight:600}
.help{margin-top:8px;display:flex;flex-direction:column}
.help div{padding:16px 4px}
.help div+div{border-top:1px solid var(--line)}
.help h2{margin:0;font-size:15px;font-weight:700}
.help p{margin:4px 0 0;font-size:14px;color:var(--ink-2);line-height:1.45}
.cta{margin-top:28px;height:56px;border-radius:56px;background:var(--blue);color:var(--blue-on);font-size:17px;font-weight:600;
  text-decoration:none;display:flex;align-items:center;justify-content:center}
.cta:focus-visible,.demo button:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.cta-in{margin-top:14px}
.cta-note{margin-top:10px;text-align:center;font-size:13px;color:var(--ink-2)}
.foot{margin-top:auto;padding-top:28px;text-align:center;font-size:12px;color:var(--note);line-height:1.5}
._unused{margin-top:22px;border:1.5px dashed var(--line);border-radius:18px;padding:14px}
.demo p{margin:0 0 10px;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--note)}
.demo .chips{display:flex;flex-wrap:wrap;gap:8px}
.demo button{font:inherit;font-size:13px;font-weight:600;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);
  border-radius:999px;padding:8px 12px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;min-height:40px;font-variant-numeric:tabular-nums}
.demo button i{width:10px;height:10px;border-radius:10px;display:inline-block}
.demo button[aria-pressed="true"]{border-color:var(--ink)}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}

.loading h1{color:var(--ink-2)}
.dot[data-s="load"]{background:var(--soft)}

</style>
</head>

    const left = Math.round((due - today)/DAY);
    const pct = Math.max(0, Math.min(100, (today - start)/(due - start)*100));
    const s = left < 0 ? 'bad' : left <= WARN_DAYS ? 'warn' : 'ok';
    base(s);
    $('time').hidden = false; $('cta').hidden = true; $('ctaNote').hidden = true; $('helpProBox').hidden = false;
    $('title').textContent = {ok:'Cartucho al día.', warn:'Queda poco.', bad:'Toca cambiarlo.'}[s];
    $('sub').innerHTML = s === 'bad'
      ? `<b>La fecha era el ${fmt(due)}.</b><span>Hace ${dias(-left)}.</span>`
      : `<b>Toca cambiarlo el ${fmt(due)}.</b><span>Quedan ${dias(left)}.</span>`;
    $('startLabel').textContent = cambio ? 'Último cambio' : 'Registrada';
    $('d0').textContent = fmt(start); $('d1').textContent = fmt(due);
    $('fill').dataset.s = s; $('fill').style.width = pct + '%'; $('now').style.left = pct + '%';
    if(cambio){ $('last').hidden = false; $('last').innerHTML = `Instalada el <b>${fmt(reg)}</b>. Cartucho cambiado el <b>${fmt(cambio)}</b>.`; }
    else $('last').hidden = true;
    $('helpHome').textContent = {
      ok:'No tienes que hacer nada. Cuando toque, pídele el cambio a tu instalador.',
      warn:'Queda poco para cambiar el cartucho. Avisa a tu instalador cuando te venga bien.',
      bad:'Ya toca cambiar el cartucho. Pídeselo a tu instalador.'}[s];
    $('helpPro').textContent = s === 'ok'
      ? 'Te avisamos por email antes de la fecha. Cuando lo cambies, vuelve a escanear esta tira y regístralo: la página vuelve a empezar.'
      : s === 'warn' ? 'Te hemos enviado el recordatorio por email. Cuando lo cambies, regístralo aquí y esta página vuelve a verde.'
      : 'Cuando lo cambies, regístralo aquí y esta página vuelve a verde.';
    $('cambio').href = CAMBIO + encodeURIComponent(ref);
    $('cambio').hidden = s === 'ok';
  }

  $('time').hidden = true; $('helpProBox').hidden = true; $('helpHome').textContent = '';
  if(!valid){
    base('none'); $('ref').textContent = 'Montana';
    message('Código no reconocido.', '<b>Escanea el QR de la tira de tu Montana.</b><span>O revisa el código que aparece en ella.</span>',
      'Si no encuentras la tira, pregunta a tu instalador.');
    return;
  }
  $('ref').textContent = 'Montana · ' + ref;
  // Etiquetas de demostración para enseñar a clientes: estado fijo calculado sobre la fecha de hoy.
  const iso = d => d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  const DEMO = { '10LW12-000-901': 120, '10LW12-000-902': 395 };
  if (ref in DEMO) { render({ reg: iso(new Date(today.getTime() - DEMO[ref]*DAY)) }); return; }
  fetch('data.json?v=' + Date.now(), {cache:'no-store'})
    .then(r => { if(!r.ok) throw new Error(r.status); return r.json(); })
    .then(d => render((d.items || {})[ref] || null))
    .catch(() => { base('none'); message('No se ha podido cargar.', '<b>Revisa tu conexión.</b><span>Y vuelve a escanear el QR.</span>', ''); });
})();
</script>
</body>
</html>
